name: CI

# 在 main 的提交和所有 PR 上运行完整验证。
# 直接推送到功能分支不会触发，避免与 PR 事件重复运行；分支没有 PR 时可按需手动触发。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pom.xml 的 maven-enforcer 把 Maven 限定在 [3.9.16,3.9.17)，即只接受 3.9.16。
  # 运行器预装的 Maven 不一定正好是这个补丁版本，因此显式安装团队统一使用的版本。
  MAVEN_VERSION: 3.9.16

jobs:
  verify:
    name: mvn verify (Windows / JDK 25)
    # 选择 Windows 运行器：图书馆等模块的持久化测试会通过 UcanAccess 驱动真实的 .accdb
    # 文件，课程也要求在计算中心的 Windows 机器上运行，CI 应与真实运行环境一致。
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "maven-$env:MAVEN_VERSION.zip"
          Invoke-WebRequest -Uri "https://archive.apache.org/dist/maven/maven-3/$env:MAVEN_VERSION/binaries/apache-maven-$env:MAVEN_VERSION-bin.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\apache-maven-$env:MAVEN_VERSION\bin"

      - name: Show toolchain
        run: mvn -version

      - name: Verify
        run: mvn -B -ntp verify

      # 失败时保留各模块的 Surefire 报告，便于在 Actions 页面直接定位失败用例。
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
